format = 4
id = "github.com/LiteLDev/levilamina-mod-template"
version = "0.0.0"

[info]
name = "My Mod"
description = "Description of my mod"
tags = []
logo = "https://example.com/my-mod/avatar.png"

# The default variant has an entry for each side: the server build for servers and the client
# build for clients, so the mod is installed as "<id>" on either side.

[[variants.""]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/levilamina-mod-template-server-windows-x64.zip"]
place = [{ src = "my-mod/", dest = "mods/my-mod/" }]

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
# The bare id, not "#client": a lip.toml dependency is never rewritten, and lip.toml releases of
# LeviLamina have no "client" variant. The range starts above 26.60.6, the last tooth.json release,
# because the "" variant of a tooth.json release is the server build.
"github.com/LiteLDev/LeviLamina" = ">26.60.6 <26.61.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/levilamina-mod-template-client-windows-x64.zip"]
place = [{ src = "my-mod/", dest = "mods/my-mod/" }]
